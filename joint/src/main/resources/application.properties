spring.application.name=joint
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080
server.servlet.context-path=/api

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=ASSIGN_ID
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

jwt.secret=${JWT_SECRET:joint-phase-3-secret-key-must-be-at-least-32}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.cache.type=redis

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=${FILE_UPLOAD_DIR:uploads}
file.base-url=${FILE_BASE_URL:http://localhost:${server.port}${server.servlet.context-path}}

oss.dir=${OSS_DIR:uploads}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
